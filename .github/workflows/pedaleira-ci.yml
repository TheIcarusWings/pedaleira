# Pedaleira portability check: build and run the DSP tests on the platforms we
# do not build by hand. Kept separate from upstream's build.yml (the release
# pipeline) so upstream merges never touch it.
#
# Private repos pay for runner minutes (Windows 2x, macOS 10x). Linux runs on
# every pull request into main. Windows takes over an hour of billed-double
# time, so it runs on demand (once per phase, or when Windows-specific code
# changes); macOS is built locally every day and is opt-in too. Only the test
# and tool targets are built: the plugin formats are built on the Mac.
name: Pedaleira CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_windows:
        description: Also build on Windows
        type: boolean
        default: true
      include_macos:
        description: Also build on macOS
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pedaleira-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Submodules after checkout, with eigen from its GitHub mirror: gitlab.com
      # refusing under load must not fail the build (same pinned commit).
      - name: Submodules
        shell: bash
        run: |
          git config --global url."https://github.com/eigen-mirror/eigen".insteadOf "https://gitlab.com/libeigen/eigen"
          git submodule update --init --recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libgtk-3-dev libasound2-dev libjack-jackd2-dev \
            libcurl4-openssl-dev libfreetype6-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxi-dev libxinerama-dev \
            libxrandr-dev libxrender-dev xvfb
      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_TOOLCHAIN_FILE=cmake/linux-toolchain.cmake \
            -DBUILD_AAX=OFF -DBUILD_CLAP=OFF
      - name: Build
        run: cmake --build build --parallel --target DspTests PedaleiraRender PedaleiraPluginScan
      - name: DSP tests
        run: ctest --test-dir build/test --output-on-failure --timeout 300

  windows:
    name: Windows x64
    if: github.event_name == 'workflow_dispatch' && inputs.include_windows
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      # Submodules after checkout, with eigen from its GitHub mirror: gitlab.com
      # refusing under load must not fail the build (same pinned commit).
      - name: Submodules
        shell: bash
        run: |
          git config --global url."https://github.com/eigen-mirror/eigen".insteadOf "https://gitlab.com/libeigen/eigen"
          git submodule update --init --recursive
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        shell: bash
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_AAX=OFF -DBUILD_CLAP=OFF -DBUILD_LV2=OFF
      - name: Build
        run: cmake --build build --parallel --target DspTests PedaleiraRender PedaleiraPluginScan
      - name: DSP tests
        run: ctest --test-dir build/test --output-on-failure --timeout 300

  macos:
    name: macOS arm64
    if: github.event_name == 'workflow_dispatch' && inputs.include_macos
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Submodules after checkout, with eigen from its GitHub mirror: gitlab.com
      # refusing under load must not fail the build (same pinned commit).
      - name: Submodules
        shell: bash
        run: |
          git config --global url."https://github.com/eigen-mirror/eigen".insteadOf "https://gitlab.com/libeigen/eigen"
          git submodule update --init --recursive
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_AAX=OFF -DBUILD_CLAP=OFF -DBUILD_LV2=OFF
      - name: Build
        run: cmake --build build --parallel --target DspTests PedaleiraRender PedaleiraPluginScan
      - name: DSP tests
        run: ctest --test-dir build/test --output-on-failure --timeout 300
